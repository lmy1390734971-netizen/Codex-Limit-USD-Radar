name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        shell: powershell
        run: .\tests\Run-Tests.ps1
      - name: Build launcher
        shell: powershell
        run: .\Build.ps1
